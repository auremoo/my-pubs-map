<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Glass body -->
  <path d="M148 170 L164 410 C166 428 180 440 198 440 L310 440 C328 440 342 428 344 410 L360 170 Z" fill="url(#glass)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Beer liquid -->
  <path d="M155 200 L168 405 C170 420 182 430 198 430 L310 430 C326 430 338 420 340 405 L353 200 Z" fill="url(#beer)" opacity="0.9"/>
  <!-- Bubbles -->
  <circle cx="220" cy="350" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="280" cy="320" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle cx="250" cy="370" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="300" cy="360" r="3.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="210" cy="300" r="4.5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="260" cy="280" r="3" fill="rgba(255,255,255,0.2)"/>
  <!-- Foam -->
  <path d="M145 190 C145 160 170 148 195 155 C205 135 230 120 254 125 C278 120 303 135 313 155 C338 148 363 160 363 190 L360 200 C358 210 350 200 340 205 C330 210 320 200 310 205 C300 210 290 200 280 205 C270 210 260 200 250 205 C240 210 230 200 220 205 C210 210 200 200 190 205 C180 210 170 200 160 205 C150 200 148 210 148 200 Z" fill="url(#foam)"/>
  <!-- Foam highlight -->
  <path d="M175 175 C175 165 190 158 205 162 C210 150 225 142 245 145 C255 142 265 148 270 155" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M360 200 L390 200 C420 200 440 220 440 250 L440 300 C440 330 420 350 390 350 L355 350" fill="none" stroke="url(#handle)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 200 L390 200 C420 200 440 220 440 250 L440 300 C440 330 420 350 390 350 L355 350" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glass shine -->
  <path d="M180 210 L190 400" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
</svg>
